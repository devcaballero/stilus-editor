[project]
name = "stilus-text-editor"
version = "1.0.0"
description = "Editor Markdown/HTML + CSS → PDF (WeasyPrint)"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 100
src = [".", "stilus", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501", # line length handled by formatter preference; keep pragmatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
